<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdgeTTS 在线文字转语音</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --card2: #273548;
            --border: #334155;
            --text: #e2e8f0;
            --text2: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --radius: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 头部 */
        .header {
            text-align: center;
            padding: 30px 0 20px;
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }
        .header .subtitle {
            color: var(--text2);
            font-size: 0.9rem;
        }
        .header .badge {
            display: inline-block;
            background: #166534;
            color: #4ade80;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            margin-top: 4px;
        }

        /* 卡片 */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title .icon {
            width: 24px;
            text-align: center;
        }

        /* 文本输入 */
        #textInput {
            width: 100%;
            height: 180px;
            background: var(--card2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            font-size: 0.95rem;
            font-family: inherit;
            line-height: 1.8;
            resize: vertical;
            transition: border-color 0.2s;
        }
        #textInput:focus {
            outline: none;
            border-color: var(--accent);
        }
        .char-count {
            text-align: right;
            color: var(--text2);
            font-size: 0.8rem;
            margin-top: 6px;
        }

        /* 音色选择 */
        .voice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        @media (max-width: 640px) {
            .voice-grid { grid-template-columns: 1fr; }
        }
        .voice-label-group {
            font-size: 0.8rem;
            color: var(--text2);
            margin-bottom: 4px;
            font-weight: 600;
        }
        select {
            width: 100%;
            background: var(--card2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 12px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        select:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* 参数滑块区 */
        .params-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }
        .param-group { }
        .param-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            font-size: 0.85rem;
        }
        .param-label .name {
            font-weight: 500;
        }
        .param-label .value {
            color: var(--accent);
            font-weight: 600;
            font-size: 0.8rem;
            background: #1e3a5f;
            padding: 2px 8px;
            border-radius: 4px;
            min-width: 52px;
            text-align: center;
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--card2);
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: 2px solid var(--bg);
        }

        /* 风格标签 */
        .style-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .style-tag {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--card2);
            color: var(--text2);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        .style-tag:hover {
            border-color: var(--accent);
            color: var(--text);
        }
        .style-tag.active {
            background: #1e3a5f;
            border-color: var(--accent);
            color: #60a5fa;
        }

        /* 按钮 */
        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 16px;
        }
        .btn {
            padding: 10px 24px;
            border-radius: var(--radius);
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: var(--accent);
            color: white;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-success {
            background: #166534;
            color: #4ade80;
        }
        .btn-success:hover { background: #14532d; }
        .btn-outline {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-outline:hover { background: var(--card2); }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 加载动画 */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 音频播放器 */
        .audio-player {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--card2);
            border-radius: var(--radius);
            margin-top: 12px;
        }
        .audio-player audio {
            flex: 1;
            min-width: 0;
        }
        .hidden { display: none !important; }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 24px;
            border-radius: var(--radius);
            font-size: 0.9rem;
            z-index: 9999;
            animation: slideDown 0.3s ease;
        }
        .toast.error { background: #7f1d1d; color: #fca5a5; }
        .toast.success { background: #14532d; color: #4ade80; }
        @keyframes slideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* 预设文本区 */
        .preset-texts {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }
        .preset-btn {
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--card2);
            color: var(--text2);
            font-size: 0.78rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .preset-btn:hover {
            border-color: var(--accent);
            color: var(--text);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            color: var(--text2);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>🎙️ EdgeTTS 在线文字转语音</h1>
            <div class="subtitle">基于微软 Edge TTS 免费语音合成服务 · 无需 API Key</div>
            <span class="badge">🆓 永久免费</span>
        </div>

        <!-- 文本输入 -->
        <div class="card">
            <div class="card-title"><span class="icon">📝</span>输入文本</div>
            <div class="preset-texts" id="presetTexts"></div>
            <textarea id="textInput" placeholder="在此输入要转换的文字...&#10;&#10;支持中文、英文、日语、韩语等多语言，每句话后会自动添加停顿。">欢迎使用微软EdgeTTS在线文字转语音服务。这是一项完全免费的语音合成技术，由微软深度神经网络驱动，能够生成高度自然的语音输出。您可以自由切换多种音色，调整语速、音调和情感风格，创造出最适合您需求的语音效果。</textarea>
            <div class="char-count"><span id="charCount">0</span> / 5000 字符</div>
        </div>

        <!-- 音色选择 -->
        <div class="card">
            <div class="card-title"><span class="icon">🎤</span>选择音色</div>
            <div class="voice-label-group">语言筛选</div>
            <div style="margin-bottom:10px;">
                <select id="langFilter" onchange="filterVoices()">
                    <option value="all">全部语言</option>
                    <option value="zh-CN" selected>中文普通话</option>
                    <option value="zh-HK">粤语</option>
                    <option value="zh-TW">台语</option>
                    <option value="en-US">英语（美国）</option>
                    <option value="en-GB">英语（英国）</option>
                    <option value="en-AU">英语（澳洲）</option>
                    <option value="ja-JP">日语</option>
                    <option value="ko-KR">韩语</option>
                </select>
            </div>
            <div class="voice-label-group">音色</div>
            <select id="voiceSelect" onchange="onVoiceChange()"></select>
            <div style="margin-top:6px;font-size:0.8rem;color:var(--text2);" id="voiceInfo"></div>
        </div>

        <!-- 情感风格 -->
        <div class="card" id="styleCard">
            <div class="card-title"><span class="icon">🎭</span>情感风格 <span style="font-size:0.75rem;color:var(--text2);">（仅部分音色支持）</span></div>
            <div class="style-tags" id="styleTags"></div>
            <div style="margin-top:8px;" id="styleDegreeRow">
                <div class="param-label">
                    <span class="name">风格强度</span>
                    <span class="value" id="styleDegreeVal">100%</span>
                </div>
                <input type="range" id="styleDegree" min="20" max="200" value="100" step="5" oninput="updateLabel('styleDegreeVal', this.value, '%')">
            </div>
        </div>

        <!-- 参数调节 -->
        <div class="card">
            <div class="card-title"><span class="icon">🎚️</span>语音参数</div>
            <div class="params-grid">
                <div class="param-group">
                    <div class="param-label">
                        <span class="name">🐢 语速</span>
                        <span class="value" id="rateVal">0%</span>
                    </div>
                    <input type="range" id="rate" min="-50" max="100" value="0" step="5" oninput="updateLabel('rateVal', this.value, '%')">
                </div>
                <div class="param-group">
                    <div class="param-label">
                        <span class="name">🎵 音调</span>
                        <span class="value" id="pitchVal">0Hz</span>
                    </div>
                    <input type="range" id="pitch" min="-20" max="20" value="0" step="1" oninput="updateLabel('pitchVal', this.value, 'Hz')">
                </div>
                <div class="param-group">
                    <div class="param-label">
                        <span class="name">🔊 音量</span>
                        <span class="value" id="volumeVal">100%</span>
                    </div>
                    <input type="range" id="volume" min="20" max="200" value="100" step="5" oninput="updateLabel('volumeVal', this.value, '%')">
                </div>
                <div class="param-group">
                    <div class="param-label">
                        <span class="name">⏸️ 句间停顿</span>
                        <span class="value" id="silenceVal">0ms</span>
                    </div>
                    <input type="range" id="silenceMs" min="0" max="2000" value="0" step="50" oninput="updateLabel('silenceVal', this.value, 'ms')">
                </div>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="btn-row">
            <button class="btn btn-primary" onclick="previewAudio()" id="btnPreview">
                <span>▶️</span> 试听预览
            </button>
            <button class="btn btn-success" onclick="downloadAudio()" id="btnDownload">
                <span>⬇️</span> 下载 MP3
            </button>
            <button class="btn btn-outline" onclick="stopAudio()" id="btnStop">
                <span>⏹️</span> 停止
            </button>
        </div>

        <!-- 音频播放器 -->
        <div class="audio-player hidden" id="audioPlayerBox">
            <span>🔊</span>
            <audio id="audioPlayer" controls></audio>
        </div>

        <!-- Footer -->
        <div class="footer">
            Powered by Microsoft Edge TTS · 完全免费 · 无需 API Key · 本地处理
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>

    <script>
        // ============================================================
        // 全局状态
        // ============================================================
        let voicesData = {};
        let styleLabels = {};
        let currentStyle = 'general';
        let audioBlobUrl = null;

        // ============================================================
        // 预设文本
        // ============================================================
        const presetTexts = {
            'zh': [
                { label: '新闻播报', text: '各位观众晚上好，今天是二零二五年七月二十三日。今天的头条新闻是：全球人工智能技术取得重大突破，新一代语音合成技术已经能够完美模拟人类情感表达。' },
                { label: '故事讲述', text: '从前，在一座遥远的大山里，住着一位善良的老爷爷。每天清晨，他都会到山间的小溪边打水，然后给村里的孩子们讲述精彩的故事。' },
                { label: '客服问候', text: '您好，欢迎致电我们的服务热线。为了保证服务质量，您的通话可能会被录音。业务咨询请按一，投诉建议请按二，人工服务请按三。' },
                { label: '诗歌朗诵', text: '床前明月光，疑是地上霜。举头望明月，低头思故乡。这首静夜思是唐代诗人李白最脍炙人口的作品之一。' },
                { label: '英语介绍', text: 'Hello everyone, welcome to EdgeTTS. This is a free text-to-speech service powered by Microsoft neural networks. You can adjust the speaking rate, pitch, volume, and even the emotional style of the voice.' },
            ]
        };

        function renderPresets() {
            const container = document.getElementById('presetTexts');
            container.innerHTML = '';
            for (const cat of Object.values(presetTexts)) {
                for (const p of cat) {
                    const btn = document.createElement('span');
                    btn.className = 'preset-btn';
                    btn.textContent = p.label;
                    btn.onclick = () => {
                        document.getElementById('textInput').value = p.text;
                        updateCharCount();
                    };
                    container.appendChild(btn);
                }
            }
        }

        // ============================================================
        // Toast 提示
        // ============================================================
        function showToast(msg, type = 'error') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `toast ${type}`;
            toast.classList.remove('hidden');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.add('hidden'), 4000);
        }

        // ============================================================
        // 参数标签更新
        // ============================================================
        function updateLabel(id, value, suffix) {
            document.getElementById(id).textContent = (value >= 0 ? '+' : '') + value + suffix;
        }

        // ============================================================
        // 字符计数
        // ============================================================
        function updateCharCount() {
            const len = document.getElementById('textInput').value.length;
            document.getElementById('charCount').textContent = len;
        }
        document.getElementById('textInput').addEventListener('input', updateCharCount);
        updateCharCount();

        // ============================================================
        // 加载音色数据
        // ============================================================
        async function loadVoices() {
            try {
                const resp = await fetch('/api/voices');
                voicesData = await resp.json();
            } catch(e) {
                console.error('加载音色失败:', e);
                showToast('加载音色数据失败，请确保后端服务已启动');
            }
        }
        async function loadStyleLabels() {
            try {
                const resp = await fetch('/api/style-labels');
                styleLabels = await resp.json();
            } catch(e) {}
        }

        // ============================================================
        // 音色筛选
        // ============================================================
        function filterVoices() {
            const lang = document.getElementById('langFilter').value;
            const select = document.getElementById('voiceSelect');
            select.innerHTML = '';

            let filtered = Object.entries(voicesData);
            if (lang !== 'all') {
                filtered = filtered.filter(([id, v]) => v.lang === lang);
            }

            let firstVoice = null;
            filtered.forEach(([id, v]) => {
                const option = document.createElement('option');
                option.value = id;
                option.textContent = v.name;
                select.appendChild(option);
                if (!firstVoice) firstVoice = id;
            });

            if (firstVoice) {
                select.value = firstVoice;
            }
            onVoiceChange();
        }

        // ============================================================
        // 音色切换
        // ============================================================
        function onVoiceChange() {
            const voiceId = document.getElementById('voiceSelect').value;
            const voice = voicesData[voiceId];
            if (!voice) return;

            document.getElementById('voiceInfo').textContent = 
                `语言: ${voice.lang} | 性别: ${voice.gender === 'Female' ? '女' : '男'} | 类型: ${voice.category} | 特点: ${voice.personality}`;

            renderStyles(voiceId);
        }

        // ============================================================
        // 渲染风格标签
        // ============================================================
        function renderStyles(voiceId) {
            const voice = voicesData[voiceId];
            const container = document.getElementById('styleTags');
            const degreeRow = document.getElementById('styleDegreeRow');
            container.innerHTML = '';

            if (!voice || !voice.styles || voice.styles.length <= 1) {
                container.innerHTML = '<span style="color:var(--text2);font-size:0.8rem;">该音色仅支持通用风格</span>';
                degreeRow.classList.add('hidden');
                currentStyle = 'general';
                return;
            }

            degreeRow.classList.remove('hidden');
            voice.styles.forEach(s => {
                const tag = document.createElement('span');
                tag.className = 'style-tag';
                tag.textContent = styleLabels[s] || s;
                tag.dataset.style = s;
                if (s === currentStyle || (s === 'general' && !voice.styles.includes(currentStyle))) {
                    tag.classList.add('active');
                    currentStyle = s;
                }
                tag.onclick = () => {
                    container.querySelectorAll('.style-tag').forEach(t => t.classList.remove('active'));
                    tag.classList.add('active');
                    currentStyle = s;
                };
                container.appendChild(tag);
            });

            // 确保 currentStyle 在可用风格中
            if (!voice.styles.includes(currentStyle)) {
                currentStyle = 'general';
                const firstTag = container.querySelector('.style-tag');
                if (firstTag) firstTag.classList.add('active');
            }
        }

        // ============================================================
        // 获取当前参数
        // ============================================================
        function getParams() {
            return {
                text: document.getElementById('textInput').value.trim(),
                voice: document.getElementById('voiceSelect').value,
                rate: (parseInt(document.getElementById('rate').value) || 0) + '%',
                pitch: (parseInt(document.getElementById('pitch').value) || 0) + 'Hz',
                volume: (parseInt(document.getElementById('volume').value) || 100) + '%',
                style: currentStyle,
                styleDegree: parseInt(document.getElementById('styleDegree').value) || 100,
                silenceMs: parseInt(document.getElementById('silenceMs').value) || 0,
            };
        }

        function setButtonLoading(btn, loading) {
            if (loading) {
                btn.disabled = true;
                btn.dataset.originalHTML = btn.innerHTML;
                btn.innerHTML = '<span class="spinner"></span> 生成中...';
            } else {
                btn.disabled = false;
                btn.innerHTML = btn.dataset.originalHTML || btn.innerHTML;
            }
        }

        // ============================================================
        // 预览播放
        // ============================================================
        async function previewAudio() {
            const params = getParams();
            if (!params.text) {
                showToast('请输入要转换的文本');
                return;
            }

            const btn = document.getElementById('btnPreview');
            setButtonLoading(btn, true);

            try {
                const resp = await fetch('/api/preview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(params),
                });

                if (!resp.ok) {
                    const err = await resp.json();
                    throw new Error(err.error || '请求失败');
                }

                const data = await resp.json();
                if (data.error) throw new Error(data.error);

                // 播放
                const audioEl = document.getElementById('audioPlayer');
                const box = document.getElementById('audioPlayerBox');
                box.classList.remove('hidden');

                // 释放旧 URL
                if (audioBlobUrl) URL.revokeObjectURL(audioBlobUrl);

                const binary = atob(data.audio);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                const blob = new Blob([bytes], { type: 'audio/mpeg' });
                audioBlobUrl = URL.createObjectURL(blob);
                audioEl.src = audioBlobUrl;
                audioEl.play().catch(e => console.warn('播放失败:', e));

                showToast('试听生成成功！', 'success');
            } catch(e) {
                showToast('生成失败: ' + e.message);
            } finally {
                setButtonLoading(btn, false);
            }
        }

        // ============================================================
        // 下载 MP3
        // ============================================================
        async function downloadAudio() {
            const params = getParams();
            if (!params.text) {
                showToast('请输入要转换的文本');
                return;
            }

            const btn = document.getElementById('btnDownload');
            setButtonLoading(btn, true);

            try {
                const resp = await fetch('/api/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(params),
                });

                if (!resp.ok) {
                    const err = await resp.json();
                    throw new Error(err.error || '下载失败');
                }

                const blob = await resp.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;

                // 生成文件名
                const voice = voicesData[params.voice];
                const voiceName = voice ? voice.name.replace(/[^\w\u4e00-\u9fff]/g, '_') : params.voice;
                a.download = `EdgeTTS_${voiceName}_${params.style}.mp3`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                showToast('下载成功！', 'success');
            } catch(e) {
                showToast('下载失败: ' + e.message);
            } finally {
                setButtonLoading(btn, false);
            }
        }

        // ============================================================
        // 停止播放
        // ============================================================
        function stopAudio() {
            const audioEl = document.getElementById('audioPlayer');
            audioEl.pause();
            audioEl.currentTime = 0;
        }

        // ============================================================
        // 初始化
        // ============================================================
        async function init() {
            renderPresets();
            await Promise.all([loadVoices(), loadStyleLabels()]);
            filterVoices();
            document.getElementById('langFilter').value = 'zh-CN';
            filterVoices();
        }

        init();
    </script>
</body>
</html>
