<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自定义播报倒计时</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: radial-gradient(circle at 20% 10%, #1e1b4b 0%, #0b0b14 60%);
    color: #e6e6f0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  .card {
    width: min(420px, 100%);
    padding: 28px 24px 24px;
    text-align: center;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(12px);
  }

  h1 {
    margin: 0 0 22px;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: #a5b4fc;
  }

  /* ---- 圆环 ---- */
  .ring {
    position: relative;
    width: 240px;
    height: 240px;
    margin: 0 auto 24px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: conic-gradient(#22d3ee 0deg, rgba(255,255,255,.07) 0deg);
    box-shadow: 0 0 40px rgba(34, 211, 238, 0.12);
    transition: box-shadow .3s ease;
  }

  .ring::after {
    content: "";
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    background: #0e0e18;
    box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.85);
  }

  .time {
    position: relative;
    z-index: 1;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 2.9rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }

  .ring.done {
    animation: pulse 0.9s ease-in-out infinite;
  }
  .ring.done::after { background: #2a0e1e; }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 40px rgba(244, 114, 182, 0.25); }
    50%      { box-shadow: 0 0 80px rgba(244, 114, 182, 0.75); }
  }

  /* ---- 输入 ---- */
  .row {
    display: flex;
    gap: 14px;
    justify-content: center;
    margin-bottom: 18px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #94a3b8;
  }

  input[type="number"] {
    width: 92px;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.05);
    color: #e6e6f0;
    font-size: 1.05rem;
    font-family: inherit;
    text-align: center;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  input[type="number"]:focus {
    border-color: #22d3ee;
    box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.15);
  }
  input[type="number"]:disabled { opacity: 0.4; cursor: not-allowed; }

  /* 提示词输入 */
  .phrase-field {
    display: block;
    text-align: left;
    margin-bottom: 18px;
  }
  .phrase-field span {
    display: block;
    margin-bottom: 6px;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #94a3b8;
  }
  #phraseInput {
    width: 100%;
    padding: 11px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.05);
    color: #e6e6f0;
    font-size: 1rem;
    font-family: inherit;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  #phraseInput:focus {
    border-color: #22d3ee;
    box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.15);
  }
  #phraseInput::placeholder { color: #5b6478; }

  /* ---- 按钮 ---- */
  .btns {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
  }

  button {
    flex: 1;
    padding: 13px 18px;
    border: none;
    border-radius: 14px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform .12s ease, filter .2s ease;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  #startBtn {
    background: linear-gradient(135deg, #8b5cf6, #22d3ee);
    color: #0b0b14;
  }
  #startBtn:hover:not(:disabled) { filter: brightness(1.1); }

  #resetBtn {
    background: rgba(255, 255, 255, 0.07);
    color: #cbd5e1;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  #resetBtn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.12); }

  /* ---- 开关 ---- */
  .switch {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-size: 0.88rem;
    color: #94a3b8;
    cursor: pointer;
    user-select: none;
  }
  .switch input {
    width: 17px;
    height: 17px;
    accent-color: #22d3ee;
    cursor: pointer;
  }

  .status {
    min-height: 1.2em;
    margin-top: 14px;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    color: #f472b6;
  }
</style>
</head>
<body>

<div class="card">
  <h1>自定义播报倒计时</h1>

  <div class="ring" id="ring">
    <div class="time" id="time">00:10</div>
  </div>

  <div class="row">
    <label class="field">分
      <input type="number" id="minInput" value="0" min="0" max="99">
    </label>
    <label class="field">秒
      <input type="number" id="secInput" value="10" min="0" max="59">
    </label>
  </div>

  <label class="phrase-field">
    <span>每秒播报的提示词</span>
    <input type="text" id="phraseInput" value="gay" maxlength="60"
           placeholder="输入想每秒听到的词，例如 gay">
  </label>

  <div class="btns">
    <button id="startBtn">开始</button>
    <button id="resetBtn">重置</button>
  </div>

  <label class="switch">
    <input type="checkbox" id="soundToggle" checked>
    <span>开启语音播报</span>
  </label>

  <div class="status" id="status"></div>
</div>

<script>
(function () {
  "use strict";

  /* ---------------- DOM ---------------- */
  const ringEl     = document.getElementById("ring");
  const timeEl     = document.getElementById("time");
  const minInput   = document.getElementById("minInput");
  const secInput   = document.getElementById("secInput");
  const phraseInput= document.getElementById("phraseInput");
  const startBtn   = document.getElementById("startBtn");
  const resetBtn   = document.getElementById("resetBtn");
  const soundToggle= document.getElementById("soundToggle");
  const statusEl   = document.getElementById("status");

  /* ---------------- 状态 ---------------- */
  let running     = false;
  let timerId     = null;
  let endTime     = 0;
  let remainingMs = 0;
  let totalMs     = 0;
  let lastSec     = null;

  /* ---------------- 语音 ---------------- */
  const synth = window.speechSynthesis || null;
  let enVoice = null;

  function pickVoice() {
    if (!synth) return;
    const voices = synth.getVoices();
    if (!voices || !voices.length) return;
    enVoice =
      voices.find(v => v.lang === "en-US" && /female|samantha|zira|google/i.test(v.name)) ||
      voices.find(v => v.lang === "en-US") ||
      voices.find(v => v.lang && v.lang.toLowerCase().startsWith("en")) ||
      null;
  }
  if (synth) {
    pickVoice();
    synth.onvoiceschanged = pickVoice;
  }

  // Web Audio 备用提示音
  let audioCtx = null;
  function beep() {
    try {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.value = 420;
      gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.09);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    } catch (e) { /* 忽略 */ }
  }

  // 读取用户输入的提示词
  function getPhrase() {
    return (phraseInput.value || "").trim();
  }

  function say() {
    if (!soundToggle.checked) return;

    const text = getPhrase();

    // 没填提示词：退化为提示音
    if (!text) { beep(); return; }

    if (!synth) { beep(); return; }

    try {
      // 先清空队列，保证每一秒都能发出声音
      synth.cancel();

      const u = new SpeechSynthesisUtterance(text);
      u.lang   = "en-US";
      if (enVoice) u.voice = enVoice;

      // 词越长语速越快，尽量在一秒内读完
      const len = text.length;
      u.rate = len <= 3 ? 1.25 : len <= 8 ? 1.5 : 1.8;

      u.pitch  = 1.1;
      u.volume = 1;

      synth.speak(u);
    } catch (e) {
      beep();
    }
  }

  /* ---------------- 工具 ---------------- */
  function getInputMs() {
    const m = Math.max(0, Math.min(99, parseInt(minInput.value, 10) || 0));
    const s = Math.max(0, Math.min(59, parseInt(secInput.value, 10) || 0));
    return (m * 60 + s) * 1000;
  }

  function fmt(ms) {
    const t = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(t / 60);
    const s = t % 60;
    return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  }

  function render() {
    timeEl.textContent = fmt(remainingMs);
    const pct = totalMs > 0 ? Math.max(0, Math.min(1, remainingMs / totalMs)) : 0;
    const deg = pct * 360;
    ringEl.style.background =
      "conic-gradient(#8b5cf6 0deg, #22d3ee " + deg + "deg, rgba(255,255,255,.07) " + deg + "deg)";
  }

  function setInputsDisabled(disabled) {
    minInput.disabled = disabled;
    secInput.disabled = disabled;
    phraseInput.disabled = disabled;
  }

  /* ---------------- 核心逻辑 ---------------- */
  function tick() {
    if (!running) return;

    remainingMs = endTime - performance.now();

    if (remainingMs <= 0) {
      remainingMs = 0;
      render();
      finish();
      return;
    }

    render();

    const sec = Math.ceil(remainingMs / 1000);
    if (sec !== lastSec) {
      lastSec = sec;
      if (sec > 0) say();   // 每秒一声
    }
  }

  function start() {
    if (running) return;

    if (remainingMs <= 0) {
      totalMs = getInputMs();
      remainingMs = totalMs;
    }
    if (remainingMs <= 0) {
      statusEl.textContent = "请先设置一个时间";
      return;
    }

    ringEl.classList.remove("done");
    statusEl.textContent = "";
    running = true;
    lastSec = null;
    endTime = performance.now() + remainingMs;

    setInputsDisabled(true);
    startBtn.textContent = "暂停";

    clearInterval(timerId);
    timerId = setInterval(tick, 100);
    tick(); // 立刻走第一拍
  }

  function pause() {
    if (!running) return;
    running = false;
    clearInterval(timerId);
    timerId = null;
    startBtn.textContent = "继续";
    statusEl.textContent = "已暂停";
  }

  function finish() {
    running = false;
    clearInterval(timerId);
    timerId = null;
    startBtn.textContent = "开始";
    setInputsDisabled(false);
    ringEl.classList.add("done");
    statusEl.textContent = "时间到！";
    say();
  }

  function reset() {
    running = false;
    clearInterval(timerId);
    timerId = null;
    if (synth) { try { synth.cancel(); } catch (e) {} }

    ringEl.classList.remove("done");
    startBtn.textContent = "开始";
    setInputsDisabled(false);
    statusEl.textContent = "";

    totalMs = getInputMs();
    remainingMs = totalMs;
    lastSec = null;
    render();
  }

  /* ---------------- 事件绑定 ---------------- */
  startBtn.addEventListener("click", function () {
    if (running) pause();
    else start();
  });

  resetBtn.addEventListener("click", reset);

  [minInput, secInput].forEach(function (inp) {
    inp.addEventListener("input", function () {
      if (running) return;
      totalMs = getInputMs();
      remainingMs = totalMs;
      lastSec = null;
      ringEl.classList.remove("done");
      statusEl.textContent = "";
      render();
    });
  });

  soundToggle.addEventListener("change", function () {
    if (!soundToggle.checked && synth) {
      try { synth.cancel(); } catch (e) {}
    }
  });

  // 修改提示词时，打断正在说的内容，避免串音
  phraseInput.addEventListener("input", function () {
    if (synth) { try { synth.cancel(); } catch (e) {} }
  });

  // 空格键：开始 / 暂停（输入框内不拦截）
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" && e.target.tagName !== "INPUT") {
      e.preventDefault();
      if (running) pause();
      else start();
    }
  });

  // 用户首次交互时唤醒音频上下文（部分浏览器需要）
  document.addEventListener("pointerdown", function () {
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }, { once: true });

  /* ---------------- 初始化 ---------------- */
  reset();
})();
</script>
</body>
</html>
